name: daily-news-fallback

on:
  workflow_dispatch:

# Manual disaster-recovery path only. The active 21:30 Asia/Shanghai schedule is owned by
# Codex Cloud, which submits the same skipped envelope through codex-daily-pr-publish.yml.

permissions:
  contents: read
  actions: write # to dispatch/inspect Pages after the protected deploy-key push

concurrency:
  group: daily-data-publish
  cancel-in-progress: false

jobs:
  skipped-day:
    runs-on: ubuntu-latest
    # Match the publisher's bounded Pages queue/recovery budget.
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Sync to live main before fallback dedup
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            if git fetch --quiet origin main; then
              git reset --hard FETCH_HEAD
              echo "Fallback base synchronized to live main at $(git rev-parse HEAD)."
              exit 0
            fi
            echo "live-main fetch attempt ${attempt}/3 failed."
            if [ "$attempt" -lt 3 ]; then sleep $((attempt * 10)); fi
          done
          echo "::error::Cannot verify live main; refusing to create a fallback from stale data."
          exit 1

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run fallback:skipped:news
      - run: npm run check

      - name: Commit skipped 日报 day if created
        id: prepare
        run: |
          set -euo pipefail
          echo "publish=false" >> "$GITHUB_OUTPUT"
          git add data/daily-news
          if git diff --cached --quiet; then
            echo "No skipped 日报 fallback needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(data): add skipped DailyNews fallback"
          git pull --rebase origin main
          npm ci
          npm run check
          echo "publish=true" >> "$GITHUB_OUTPUT"

      - name: Push accepted fallback and deploy
        if: steps.prepare.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PUBLISH_DEPLOY_KEY: ${{ secrets.CODEX_PUBLISH_DEPLOY_KEY }}
          PUBLISH_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          bash scripts/push-main-with-deploy-key.sh
          bash scripts/dispatch-pages.sh "$(git rev-parse HEAD)"
