name: daily-news-monitor

# Manual deterministic monitor for incident recovery. The active 14:45 Asia/Shanghai
# monitor runs in Codex Cloud; this workflow is retained as an operator-triggered check
# of live main plus the correlated Pages deployment.

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  issues: write

concurrency:
  group: daily-news-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false

      - name: Check today's 日报 three-item minimum and deployment
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          DATE="$(TZ=Asia/Shanghai date +%F)"

          open_deployment_issue() {
            local detail="$1" title existing body
            title="Pages 部署核验告警: ${DATE}"
            body="自动监控：${detail}。请检查 Pages workflow，并确认生产端与 live main 对齐。"
            existing="$(gh issue list --state open --json number,title --jq "[.[]|select(.title|contains(\"Pages 部署核验告警: ${DATE}\"))][0].number // empty")"
            if [ -n "$existing" ]; then
              gh issue comment "$existing" --body "$body"
            else
              gh issue create --title "$title" --body "$body"
            fi
            echo "::warning::${detail}"
          }

          LIVE_SHA=""
          for attempt in 1 2 3; do
            if git fetch --quiet --depth=1 origin main; then
              LIVE_SHA="$(git rev-parse FETCH_HEAD)"
              break
            fi
            echo "live-main fetch attempt ${attempt}/3 failed."
            if [ "$attempt" -lt 3 ]; then sleep $((attempt * 10)); fi
          done
          if [ -z "$LIVE_SHA" ]; then
            open_deployment_issue "无法读取 live main，DailyNews 内容与部署新鲜度均无法核验"
            exit 0
          fi

          FILE="data/daily-news/${DATE}.json"

          if git cat-file -e "FETCH_HEAD:${FILE}" 2>/dev/null; then
            STATE="$(git show "FETCH_HEAD:${FILE}" 2>/dev/null | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{try{const e=JSON.parse(s);const st=String(e.status||"invalid");const v=["published","partial"].includes(st)&&Array.isArray(e.items)?e.items.filter(i=>i&&i.published!==false).length:0;const r=Number(e.run_report?.published);process.stdout.write(`${st}\t${Number.isInteger(r)?r:-1}\t${v}`)}catch(e){process.stdout.write("invalid\t-1\t0")}})' || printf 'invalid\t-1\t0')"
          else
            STATE=$'missing\t0\t0'
          fi
          IFS=$'\t' read -r STATUS REPORTED VISIBLE <<< "$STATE"
          echo "date=${DATE} status=${STATUS} reported=${REPORTED} visible=${VISIBLE} minimum=3"

          if { [ "$STATUS" = "published" ] || [ "$STATUS" = "partial" ]; } \
            && [ "$REPORTED" -eq "$VISIBLE" ] && [ "$VISIBLE" -ge 3 ]; then
            PAGES_RUN=""
            PAGES_CHECKED=false
            for attempt in 1 2 3; do
              if PAGES_RUN="$(gh run list --workflow=pages.yml --status=success --limit=40 \
                --json databaseId,headSha \
                --jq "[.[] | select(.headSha == \"${LIVE_SHA}\")][0].databaseId // empty")"; then
                PAGES_CHECKED=true
                break
              fi
              echo "Pages run-list attempt ${attempt}/3 failed."
              if [ "$attempt" -lt 3 ]; then sleep $((attempt * 10)); fi
            done
            if [ "$PAGES_CHECKED" != "true" ]; then
              open_deployment_issue "无法读取成功 Pages runs；live main SHA ${LIVE_SHA} 的部署状态未知"
            elif [ -z "$PAGES_RUN" ]; then
              open_deployment_issue "live main SHA ${LIVE_SHA} 尚无对应的成功 Pages run"
            else
              echo "OK: today's 日报 has ${VISIBLE}/3 visible items and Pages run ${PAGES_RUN} covers live main ${LIVE_SHA}."
            fi
            exit 0
          fi

          TITLE="DailyNews 未发布告警: ${DATE} (${STATUS}, ${VISIBLE}/3)"
          BODY="自动监控：\`data/daily-news/${DATE}.json\`（Asia/Shanghai）状态为 \`${STATUS}\`，报告 \`${REPORTED}\` 条、读者可见 \`${VISIBLE}/3\` 条，未达到每日最低三条。请检查 Codex Cloud 每日任务与候选 PR。"
          EXISTING="$(gh issue list --state open --json number,title --jq "[.[]|select(.title|contains(\"DailyNews 未发布告警: ${DATE}\"))][0].number // empty")"

          if [ -n "$EXISTING" ]; then
            gh issue comment "$EXISTING" --body "$BODY"
          else
            gh issue create --title "$TITLE" --body "$BODY"
          fi
